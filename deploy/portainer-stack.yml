services:
  spab-sman1gedeg:
    image: ghcr.io/ardianryan/spab-sman1gedeg:latest
    restart: unless-stopped
    ports:
      - "${SPAB_BIND_IP:-127.0.0.1}:${SPAB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
